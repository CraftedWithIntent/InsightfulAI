name: Build and Push Docker Image to GHCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/insightful-ai:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/insightful-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo "Image pushed successfully"

      - name: Create GitHub Release with Docker info
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## Docker Images

            This release is available as Docker images:

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/insightful-ai:${{ steps.version.outputs.version }}
            docker pull ghcr.io/${{ github.repository_owner }}/insightful-ai:latest
            ```

            See [README.md](README.md) for usage instructions.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
